services:
  eomoe:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
    # model.path in ./config/config.yaml should point under /app/models.
    environment:
      - EOMOE_CONFIG_PATH=/app/config/config.yaml
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
