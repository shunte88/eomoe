# eomoe configuration. Every key is optional; CLI flags and env vars override these values.
# Load with --config <file> or EOMOE_CONFIG_PATH=<file>.

model:
  path: "/opt/eomoe/models/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf"
  ctx_size: 32768
  # cache_mib: 4000        # VRAM for the expert cache; default: all free VRAM

server:
  host: "127.0.0.1"
  port: 8080
  alias: "local-code"       # model name clients use
  # parallel: 4             # requests served at once
  # cache_ram: 0            # MiB of host RAM for displaced prompts' KV (llama-server --cache-ram, default 8192 there); 0 off, -1 no limit
  # api_key: "key1,key2"    # require a key (Bearer or x-api-key); /health and / stay open
  # api_key_file: "/etc/eomoe/keys"   # one key per line, # comments
  # ssl_key_file: "/etc/eomoe/key.pem"    # both set: serve HTTPS
  # ssl_cert_file: "/etc/eomoe/cert.pem"

logging:
  level: "info"
