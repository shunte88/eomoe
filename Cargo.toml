[package]
name = "eomoe"
version = "0.1.0"
edition = "2021"
description = "Expert One-Way Context Mixture of Experts LLM"
authors = ["S. Hunter","Claude Code"]
license = "MIT"
repository = "https://github.com/claude-code/eomoe"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
clap = { version = "4.4", features = ["derive", "env"] }
cuda-sys = "0.2"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
memmap2 = "0.9.12"
fancy-regex = "0.20.2"
minijinja = { version = "3.1.0", features = ["preserve_order", "loop_controls", "json", "serde"] }
half = "2.7.1"
rayon = "1.12.0"

[dev-dependencies]
tokio-test = "0.4"
