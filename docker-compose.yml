services:
  eomoe:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
    # Config is read from EOMOE_CONFIG_PATH (/app/config/config.yaml, set in the image).
    # Its model.path should point under /app/models.
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
