<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eomoe chat</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: .5rem; align-items: center; padding: .5rem 1rem; border-bottom: 1px solid #8884; }
  header h1 { font-size: 1rem; margin: 0 auto 0 0; }
  #log { flex: 1; overflow-y: auto; padding: 1rem; max-width: 50rem; width: 100%; margin: 0 auto; box-sizing: border-box; }
  .msg { white-space: pre-wrap; margin: 0 0 1rem; padding: .5rem .75rem; border-radius: .5rem; }
  .user { background: #8882; }
  .err { color: #c33; }
  form { display: flex; gap: .5rem; padding: .75rem 1rem; border-top: 1px solid #8884; max-width: 50rem; width: 100%; margin: 0 auto; box-sizing: border-box; }
  textarea { flex: 1; font: inherit; resize: vertical; min-height: 2.5rem; }
  button, input { font: inherit; }
</style>
</head>
<body>
<header>
  <h1>eomoe</h1>
  <label>API key <input id="key" type="password" autocomplete="off" size="14"></label>
  <button id="clear" type="button">New chat</button>
</header>
<main id="log" aria-live="polite"></main>
<form id="f">
  <label for="in" hidden>Message</label>
  <textarea id="in" placeholder="Message (Enter to send, Shift+Enter for a new line)" required></textarea>
  <button id="send">Send</button>
</form>
<script>
const $ = id => document.getElementById(id);
const key = $("key"), log = $("log"), input = $("in"), send = $("send");
key.value = localStorage.getItem("eomoe-key") || "";
key.onchange = () => localStorage.setItem("eomoe-key", key.value);
let history = [];

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.append(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

$("clear").onclick = () => { history = []; log.replaceChildren(); input.focus(); };
input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("f").requestSubmit(); } };

$("f").onsubmit = async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  history.push({ role: "user", content: text });
  add("user", text);
  const out = add("assistant", "");
  send.disabled = true;
  try {
    const headers = { "Content-Type": "application/json" };
    if (key.value) headers.Authorization = "Bearer " + key.value;
    const r = await fetch("/v1/chat/completions", { method: "POST", headers,
      body: JSON.stringify({ model: "local-code", messages: history, stream: true }) });
    if (!r.ok) throw new Error(r.status + ": " + await r.text());
    const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const l of lines) {
        if (!l.startsWith("data: ") || l === "data: [DONE]") continue;
        const d = JSON.parse(l.slice(6)).choices?.[0]?.delta?.content;
        if (d) { out.textContent += d; log.scrollTop = log.scrollHeight; }
      }
    }
    history.push({ role: "assistant", content: out.textContent });
  } catch (err) {
    history.pop();
    out.className = "msg err";
    out.textContent = String(err.message || err);
  } finally {
    send.disabled = false;
    input.focus();
  }
};
input.focus();
</script>
</body>
</html>
