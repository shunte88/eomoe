name: Soak

# Weekly long-form GPU gates + serving stress on media2026 (self-hosted runner, label eomoe-gpu).
# Sunday 02:00 EST = 07:00 UTC (03:00 during EDT: GitHub cron is UTC-only).
# Schedule and manual runs only: no pull_request trigger may ever reach the self-hosted runner.
on:
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      stress_minutes:
        description: Serving stress duration (minutes)
        default: '30'

permissions:
  contents: read

concurrency:
  group: soak
  cancel-in-progress: false

jobs:
  soak:
    if: github.repository == 'shunte88/eomoe'
    runs-on: [self-hosted, eomoe-gpu]
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - run: tools/soak.sh
        env:
          STRESS_MINUTES: ${{ inputs.stress_minutes || '30' }}
          SOAK_OUT: soak-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-logs
          path: soak-logs/
